name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run generate -w apps/api

      - name: Typecheck API
        run: npm run typecheck -w apps/api

      - name: Typecheck Web
        run: npm run typecheck -w apps/web
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Build API
        run: npm run build:api

      - name: Build Web
        run: npm run build:web
        env:
          NEXT_TELEMETRY_DISABLED: 1

  test-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: homemart
          POSTGRES_PASSWORD: ci_secret
          POSTGRES_DB: homemart
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U homemart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://homemart:ci_secret@localhost:54329/homemart?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run generate -w apps/api

      - name: Push schema
        run: npx prisma migrate deploy
        working-directory: apps/api

      - name: Run integration tests
        run: npm test -w apps/api -- src/business-rules.spec.ts
