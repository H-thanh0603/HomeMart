# HomeMart — Production stack
# Usage:
#   cp .env.production.example .env.production   # điền secrets thật
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # volatile-lru: chỉ đuổi key có TTL. catalog:version không có TTL nên
    # không bao giờ bị LRU đuổi ra (tránh phục vụ cache stale sau eviction).
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s # đủ thời gian cho in-flight requests + prisma.$disconnect
    env_file: .env.production
    environment:
      # connection_limit/pool_timeout: chống cạn pool khi checkout đồng thời
      # (transaction checkout giữ lock tới 15s). Tăng theo số replica API.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&connection_limit=20&pool_timeout=10
      REDIS_URL: redis://redis:6379
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    restart: unless-stopped
    depends_on:
      - api

  # Backup tự động hằng ngày 02:00 vào ./backups (giữ 14 ngày).
  # LƯU Ý: copy ./backups ra ngoài máy chủ (S3/R2/ máy khác) — cùng ổ đĩa
  # với DB thì không đếm là backup.
  backup:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./docker/backup-job.sh:/etc/periodic/daily/backup:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "apk add --no-cache postgresql16-client >/dev/null && crond -f -d 8"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Mặc định: HTTP. Khi bật TLS (./docker/enable-tls.sh), .env.production
      # đặt NGINX_CONF=./docker/nginx-tls.conf và nginx nhận cert từ docker/certs/
      - ${NGINX_CONF:-./docker/nginx.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web

volumes:
  pgdata:
  redisdata:
  uploads:
