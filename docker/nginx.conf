upstream homemart_api {
    server api:4000;
    keepalive 32;
}

upstream homemart_web {
    server web:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml image/svg+xml;

    # Security headers (áp dụng cho cả 80 và 443)
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS chỉ có ý nghĩa trên 443 — để không bắn HSTS qua HTTP thuần, bật trong block 443 bên dưới
    # Khi đã có TLS, nginx sẽ tự redirect 80→443 và HSTS sẽ được gửi kèm

    # Nếu đã có certs (ENABLE_TLS=1), redirect 80→443
    # Dùng biến $https không khả dụng ở đây nên dùng include động: khi certs tồn tại, file /etc/nginx/conf.d/redirect-https.conf sẽ được mount

    # ─── API + Swagger → NestJS ──────────────────────────────────────────────
    location /api/ {
        proxy_pass http://homemart_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # ─── Next.js static assets: cache dài hạn ────────────────────────────────
    location /_next/static/ {
        proxy_pass http://homemart_web;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ─── Uploaded files (products, avatars) — served from volume ─────────────
    location /uploads/ {
        alias /app/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable" always;
    }

    # ─── Health check cho ALB / UptimeRobot — không cache ──────────────────────
    location = /health {
        proxy_pass http://homemart_api/api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ─── Placeholder ảnh sản phẩm (seed data) — sinh SVG trực tiếp ───────────
    location ~* ^/placeholder/(?<ph_name>.+)\.(?:jpe?g|png|webp|svg)$ {
        default_type image/svg+xml;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        return 200 '<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#dbeafe"/><stop offset="100%" stop-color="#93c5fd"/></linearGradient></defs><rect width="600" height="600" fill="url(#g)"/><g opacity="0.35" transform="translate(258 118)"><path d="M42 8 L84 44 H72 V88 H12 V44 H0 Z M30 56 h24 v24 h-24 Z" fill="#ffffff"/></g><text x="300" y="330" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">$ph_name</text></svg>';
    }

    # ─── Toàn bộ còn lại → Next.js ───────────────────────────────────────────
    location / {
        proxy_pass http://homemart_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

